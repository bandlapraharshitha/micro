services:
  - type: web
    name: daa-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        value: '["https://micro-one-zeta.vercel.app","http://localhost:3000"]'
      - key: FRONTEND_URL
        value: https://micro-one-zeta.vercel.app

